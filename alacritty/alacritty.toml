# Terminal
# Start a plain shell (default $SHELL). To auto-attach tmux again, uncomment:
# [terminal]
# shell = { program = '/usr/bin/tmux', args = ['new-session', '-A', '-s', 'bash'] }

# General
[general]
# Colors live in theme.toml, generated by themes/apply-theme.sh from the THEME
# variable in .env. Do not define [colors.*] here -- values in this file
# override imported ones and would pin the palette.
import = ["~/.config/alacritty/theme.toml"]
live_config_reload = true

# Font
[font]
normal = { family = "JetBrainsMonoNerdFontMono", style = "Regular"}

# Window
[window]
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
decorations = "Full"
opacity = 1.0
blur = false

# Scrolling
[scrolling]
history = 10000
multiplier = 3
