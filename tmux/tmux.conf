# True colors
#set -g default-terminal "alacritty"
#set-option -sa terminal-overrides ",alacritty*:Tc"
set -g default-terminal "tmux-256color"
# Truecolor only when the terminal advertises it (e.g. local terminal sets
# COLORTERM=truecolor). Over mosh <1.4 COLORTERM is unset, so fall back to clean
# 256-color instead of garbled 24-bit output.
if-shell '[ -n "$COLORTERM" ]' \
  'set -sa terminal-overrides ",xterm-256color:Tc"' \
  'set -su terminal-overrides'

# Change prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move the current pane (swap it with its neighbour) in that direction;
# focus follows the moved pane. L replaces the default "last session".
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

set -g mouse on

# Copy on mouse selection. tmux already copies on drag-release, but it hands the
# text to the terminal via OSC 52, which VTE terminals (Ptyxis, GNOME Terminal)
# ignore. Piping to wl-copy puts it on the system clipboard directly. Guarded so
# a headless/SSH box without Wayland keeps the OSC 52 path only.
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null' \
  "set -s copy-command 'wl-copy'"

# Session picker (fullscreen, zoomed)
bind s choose-tree -Zs
bind S command-prompt -p "New session name:" "new-session -d -s '%%' && switch-client -t '%%'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'

# Auto-restore session on tmux start
set -g @continuum-restore 'on'

# Save and restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Theme
# Status line colors live in ~/.tmux-theme.conf, generated by
# themes/apply-theme.sh from the THEME variable in .env. Guarded so a missing
# file degrades to default colors instead of erroring on startup.
if-shell '[ -f ~/.tmux-theme.conf ]' 'source-file ~/.tmux-theme.conf'

# Initialize TPM (must be at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
